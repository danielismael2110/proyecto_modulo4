<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Módulo 4 - Grupo 4 | Dashboard Power BI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Elimina scrolls de la página */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1c;
            display: flex;
            flex-direction: column;
        }

        /* Header compacto y adaptado a los bordes */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.75rem 2rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
        }

        .header h1 {
            color: #1e3c72;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1::before {
            content: "📊";
            font-size: 1.5rem;
        }

        .badge {
            background: #1e3c72;
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Contenedor del iframe - ocupa TODO el espacio restante */
        .iframe-container {
            flex: 1;
            width: 100%;
            background: #f0f2f5;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer minimalista */
        .footer {
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 0.5rem;
            font-size: 0.7rem;
            flex-shrink: 0;
            backdrop-filter: blur(5px);
        }

        /* Responsive para móviles */
        @media (max-width: 768px) {
            .header {
                padding: 0.5rem 1rem;
            }
            .header h1 {
                font-size: 0.9rem;
            }
            .badge {
                font-size: 0.65rem;
                padding: 0.25rem 0.75rem;
            }
            .footer {
                font-size: 0.6rem;
                padding: 0.35rem;
            }
        }

        /* Modo kiosko (oculta header y footer con ?fullscreen en la URL) */
        body.fullscreen .header,
        body.fullscreen .footer {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard Desempeño - Módulo 4 - Grupo 4</h1>
        <div class="badge">Power BI Interactive</div>
    </div>
    
    <div class="iframe-container">
        <iframe 
            title="proyectofinal_grupo4" 
            src="https://app.fabric.microsoft.com/reportEmbed?reportId=e036f12c-c20c-4540-832d-b717acc9b688&autoAuth=true&ctid=cf263038-f11c-49d2-9183-556a34b747e2" 
            frameborder="0" 
            allowFullScreen="true"
            allow="fullscreen">
        </iframe>
    </div>
    
    <div class="footer">
        <span>Módulo 4 - Grupo 4 | Dashboard interactivo | Microsoft Fabric</span>
    </div>

    <script>
        // Modo kiosko: agrega ?fullscreen a la URL para ocultar header y footer
        if (window.location.search.includes('fullscreen')) {
            document.body.classList.add('fullscreen');
        }
        
        // Doble clic para pantalla completa del navegador
        document.addEventListener('dblclick', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        
        // Presiona 'f' para pantalla completa
        document.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
